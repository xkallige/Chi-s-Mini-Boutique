<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | CMB Admin</title><link rel="icon" type="image/png" href="../assets/cmb.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../assets/css/custom.css?v=20261014-admin-theme2" rel="stylesheet"></head><body><header class="site-header"><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/cmb.png" alt="Chi's Mini Boutique"></a><nav class="header-nav"><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false"><span aria-hidden="true">◐</span><span data-theme-label>Dark</span></button><a href="orders.html">Orders</a><a href="delivery.html">Delivery</a><button data-admin-logout class="bag-button">Log out</button></nav></header><main class="admin-page container"><p class="eyebrow">Private  catalogue</p><h1>Products</h1><form data-product-form class="product-form" enctype="multipart/form-data"><input type="hidden" name="id"><label class="field-label">Name<input class="form-control" name="name" required maxlength="180"></label><label class="field-label">Category<select class="form-select" name="category" required></select></label><label class="field-label">Description<textarea class="form-control" name="description" rows="3"></textarea></label><div class="row"><div class="col-sm-6"><label class="field-label">Price (NGN)<input class="form-control" name="price" type="number" min="1" step="1" required></label></div><div class="col-sm-6"><label class="field-label">Stock<input class="form-control" name="stock" type="number" min="0" required></label></div></div><label class="field-label">Size
